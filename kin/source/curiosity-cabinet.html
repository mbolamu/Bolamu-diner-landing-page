<script>
(function () {
 const section = document.querySelector(".bolamu-curiosity");

 if (!section || section.dataset.carouselReady === "true") {
   return;
 }

 section.dataset.carouselReady = "true";

 const carousel = section.querySelector(".bolamu-curiosity-carousel");
 const leftArrow = section.querySelector(".bolamu-curiosity-carousel-arrow-left");
 const rightArrow = section.querySelector(".bolamu-curiosity-carousel-arrow-right");

 if (!carousel || !leftArrow || !rightArrow) {
   return;
 }

 function getScrollAmount() {
   const card = carousel.querySelector(".bolamu-curiosity-event-card");
   const styles = window.getComputedStyle(carousel);
   const gap = parseFloat(styles.columnGap || styles.gap || "0");

   return card
     ? card.getBoundingClientRect().width + gap
     : carousel.clientWidth * 0.72;
 }

 function updateArrows() {
   const maximumScroll = carousel.scrollWidth - carousel.clientWidth;
   const tolerance = 4;

   leftArrow.disabled = carousel.scrollLeft <= tolerance;
   rightArrow.disabled =
     carousel.scrollLeft >= maximumScroll - tolerance;
 }

 leftArrow.addEventListener("click", function () {
   carousel.scrollBy({
     left: -getScrollAmount(),
     behavior: "smooth"
   });
 });

 rightArrow.addEventListener("click", function () {
   carousel.scrollBy({
     left: getScrollAmount(),
     behavior: "smooth"
   });
 });

 carousel.addEventListener("keydown", function (event) {
   if (event.key === "ArrowLeft") {
     event.preventDefault();
     carousel.scrollBy({
       left: -getScrollAmount(),
       behavior: "smooth"
     });
   }

   if (event.key === "ArrowRight") {
     event.preventDefault();
     carousel.scrollBy({
       left: getScrollAmount(),
       behavior: "smooth"
     });
   }
 });

 carousel.addEventListener("scroll", updateArrows, {
   passive: true
 });

 window.addEventListener("resize", updateArrows);
 window.addEventListener("load", updateArrows);

 updateArrows();
})();
</script>
