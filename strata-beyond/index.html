<style>
  @font-face {
    font-family: "Glacial Indifference";
    src: url("https://ik.imagekit.io/vxel66ikf/GlacialIndifference-Regular.woff") format("woff");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  .strata-page,
  .strata-page * {
    box-sizing: border-box;
  }

  .strata-page {
    --strata-top-bleed: 0px;
    position: relative;
    left: 50%;
    isolation: isolate;
    width: 100vw;
    max-width: 100vw;
    height: 100vh;
    height: 100svh;
    min-height: 100vh;
    min-height: 100svh;
    margin: calc(-1 * var(--strata-top-bleed)) 0 0 -50vw !important;
    padding: 0 !important;
    overflow: hidden;
    color: #fff8e8;
    background: #000;
    font-family: "Glacial Indifference", Arial, Helvetica, sans-serif !important;
  }

  .strata-page .strata-media,
  .strata-page .strata-video,
  .strata-page .strata-treatment {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .strata-page .strata-media {
    z-index: 0;
    overflow: hidden;
    background: #000;
    pointer-events: none;
  }

  .strata-page .strata-video {
    display: block;
    border: 0;
    object-fit: cover;
    object-position: center center;
    background: #000;
    pointer-events: none;
  }

  .strata-page .strata-treatment {
    z-index: 1;
    background:
      radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, 0.24) 78%, rgba(0, 0, 0, 0.5) 100%),
      linear-gradient(90deg, rgba(0, 0, 0, 0.2), transparent 38%, transparent 66%, rgba(0, 0, 0, 0.22));
    pointer-events: none;
  }

  .strata-page .strata-copy {
    position: absolute;
    top: 52%;
    right: max(5vw, env(safe-area-inset-right));
    z-index: 2;
    width: min(36vw, 460px);
    margin: 0;
    padding: clamp(18px, 2.5vw, 30px);
    color: #fff8e8;
    text-align: left;
    text-shadow:
      0 1px 5px rgba(0, 0, 0, 0.78),
      0 0 10px rgba(255, 222, 161, 0.13);
    transform: translateY(-50%);
    animation: strata-copy-cycle 10s linear infinite;
  }

  .strata-page .strata-title,
  .strata-page .strata-poem,
  .strata-page .strata-poem-line,
  .strata-page .strata-coming-soon {
    font-family: "Glacial Indifference", Arial, Helvetica, sans-serif !important;
    font-style: normal;
  }

  .strata-page .strata-title {
    margin: 0 0 clamp(18px, 2.2vw, 28px);
    color: #fff9ec;
    font-size: clamp(2rem, 4vw, 4.25rem);
    font-weight: 400;
    line-height: 1.05;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-shadow:
      0 1px 6px rgba(0, 0, 0, 0.82),
      0 0 14px rgba(255, 216, 145, 0.16);
  }

  .strata-page .strata-poem {
    display: grid;
    gap: clamp(10px, 1.4vw, 18px);
    margin: 0 0 clamp(22px, 2.8vw, 34px);
  }

  .strata-page .strata-poem-line {
    margin: 0;
    color: rgba(255, 249, 237, 0.92);
    font-size: clamp(0.92rem, 1.35vw, 1.2rem);
    font-weight: 400;
    line-height: 1.55;
    letter-spacing: 0.09em;
  }

  .strata-page .strata-coming-soon {
    margin: 0;
    color: rgba(255, 236, 199, 0.9);
    font-size: clamp(0.7rem, 0.9vw, 0.86rem);
    font-weight: 400;
    line-height: 1.3;
    letter-spacing: 0.32em;
    text-transform: uppercase;
  }

  @keyframes strata-copy-cycle {
    0%, 10% {
      opacity: 0;
      transform: translateY(calc(-50% + 8px));
    }
    20%, 75% {
      opacity: 1;
      transform: translateY(-50%);
    }
    88%, 100% {
      opacity: 0;
      transform: translateY(calc(-50% - 5px));
    }
  }

  @media (max-width: 767px) {
    .strata-page .strata-video {
      object-position: center center;
    }

    .strata-page .strata-treatment {
      background:
        linear-gradient(to bottom, rgba(0, 0, 0, 0.1) 0%, transparent 34%, rgba(0, 0, 0, 0.14) 60%, rgba(0, 0, 0, 0.62) 100%),
        radial-gradient(ellipse at center, transparent 38%, rgba(0, 0, 0, 0.28) 100%);
    }

    .strata-page .strata-copy {
      top: auto;
      right: auto;
      bottom: max(4.5svh, env(safe-area-inset-bottom));
      left: 50%;
      width: min(92%, 520px);
      padding: 16px 18px;
      text-align: center;
      transform: translateX(-50%);
    }

    .strata-page .strata-title {
      margin-bottom: 14px;
      font-size: clamp(1.7rem, 8.5vw, 2.75rem);
      letter-spacing: 0.15em;
    }

    .strata-page .strata-poem {
      gap: 7px;
      margin-bottom: 17px;
    }

    .strata-page .strata-poem-line {
      font-size: clamp(0.83rem, 3.7vw, 1rem);
      line-height: 1.45;
      letter-spacing: 0.065em;
    }

    .strata-page .strata-coming-soon {
      font-size: clamp(0.66rem, 2.8vw, 0.78rem);
      letter-spacing: 0.27em;
    }

    @keyframes strata-copy-cycle {
      0%, 10% {
        opacity: 0;
        transform: translate(-50%, 8px);
      }
      20%, 75% {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      88%, 100% {
        opacity: 0;
        transform: translate(-50%, -5px);
      }
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .strata-page .strata-copy {
      opacity: 1;
      animation: none;
    }
  }
</style>

<main class="strata-page" id="strata-beyond-page" aria-labelledby="strata-beyond-title">
  <div class="strata-media" aria-hidden="true">
    <video
      class="strata-video"
      muted
      loop
      autoplay
      playsinline
      webkit-playsinline
      preload="auto"
      tabindex="-1"
      disablepictureinpicture
    ></video>
    <div class="strata-treatment"></div>
  </div>

  <section class="strata-copy">
    <h1 class="strata-title" id="strata-beyond-title">STRATA BEYOND</h1>
    <div class="strata-poem">
      <p class="strata-poem-line">Beyond this door,<br>memory becomes landscape.</p>
      <p class="strata-poem-line">Myth becomes architecture.</p>
      <p class="strata-poem-line">History becomes somewhere you can walk.</p>
    </div>
    <p class="strata-coming-soon">COMING SOON</p>
  </section>
</main>

<script>
  (function () {
    var page = document.getElementById("strata-beyond-page");
    if (!page || page.dataset.strataReady === "true") return;
    page.dataset.strataReady = "true";

    var MOBILE_VIDEO = "https://ik.imagekit.io/vxel66ikf/Strata%20beyond%20mobile%20video%20loop/ik-video.mp4?updatedAt=1785739532488";
    var DESKTOP_VIDEO = "https://ik.imagekit.io/vxel66ikf/Strata%20beyond%20desktop%20video%20loop/ik-video.mp4?updatedAt=1785739558251";
    var phoneQuery = window.matchMedia("(max-width: 767px)");
    var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    var video = page.querySelector(".strata-video");
    var resizeTimer = 0;

    /* Reuse the KIN embed's scoped top-bleed technique so this page alone
       reaches behind Webador's page-header space without changing the site. */
    var topGap = page.getBoundingClientRect().top;
    if (topGap > 0 && topGap <= 280) {
      page.style.setProperty("--strata-top-bleed", Math.round(topGap) + "px");
    }

    function requiredVideo() {
      return phoneQuery.matches ? MOBILE_VIDEO : DESKTOP_VIDEO;
    }

    function applyPlaybackPreference() {
      if (reducedMotion.matches) {
        if (video.readyState >= 2) {
          video.pause();
        } else {
          video.addEventListener("loadeddata", function pauseOnFrame() {
            video.removeEventListener("loadeddata", pauseOnFrame);
            video.pause();
          });
        }
        return;
      }

      var playAttempt = video.play();
      if (playAttempt && typeof playAttempt.catch === "function") {
        playAttempt.catch(function () {
          /* The loaded first frame and black fallback keep the page readable. */
        });
      }
    }

    function setVideoSource() {
      var required = requiredVideo();
      if (video.getAttribute("src") !== required) {
        video.pause();
        video.setAttribute("src", required);
        video.load();
      }
      applyPlaybackPreference();
    }

    function scheduleSourceCheck() {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(setVideoSource, 120);
    }

    setVideoSource();

    if (typeof phoneQuery.addEventListener === "function") {
      phoneQuery.addEventListener("change", setVideoSource);
      reducedMotion.addEventListener("change", setVideoSource);
    } else {
      phoneQuery.addListener(setVideoSource);
      reducedMotion.addListener(setVideoSource);
    }
    window.addEventListener("orientationchange", setVideoSource, { passive: true });
    window.addEventListener("resize", scheduleSourceCheck, { passive: true });
  })();
</script>
