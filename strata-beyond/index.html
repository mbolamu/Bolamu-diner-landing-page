<style>
  @font-face {
    font-family: "Glacial Indifference";
    src: url("https://ik.imagekit.io/vxel66ikf/GlacialIndifference-Regular.woff") format("woff");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  .strata-page,
  .strata-page * {
    box-sizing: border-box;
  }

  .strata-page {
    --strata-top-bleed: 0px;
    position: relative;
    left: 50%;
    isolation: isolate;
    width: 100vw;
    max-width: 100vw;
    height: 100vh;
    height: 100svh;
    min-height: 100vh;
    min-height: 100svh;
    margin: calc(-1 * var(--strata-top-bleed)) 0 0 -50vw !important;
    padding: 0 !important;
    overflow: hidden;
    color: #fff8e8;
    background: #000;
    font-family: "Glacial Indifference", Arial, Helvetica, sans-serif !important;
  }

  .strata-page .strata-media,
  .strata-page .strata-video,
  .strata-page .strata-treatment {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .strata-page .strata-media {
    z-index: 0;
    overflow: hidden;
    background: #000;
    pointer-events: none;
  }

  .strata-page .strata-video {
    display: block;
    border: 0;
    object-fit: cover;
    object-position: center center;
    background: #000;
    pointer-events: none;
  }

  .strata-page .strata-video::-webkit-media-controls,
  .strata-page .strata-video::-webkit-media-controls-panel,
  .strata-page .strata-video::-webkit-media-controls-start-playback-button {
    display: none !important;
    -webkit-appearance: none;
    opacity: 0;
  }

  .strata-page .strata-treatment {
    z-index: 1;
    background:
      radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, 0.24) 78%, rgba(0, 0, 0, 0.5) 100%),
      linear-gradient(90deg, rgba(0, 0, 0, 0.2), transparent 38%, transparent 66%, rgba(0, 0, 0, 0.22));
    pointer-events: none;
  }

  .strata-page .strata-copy {
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 2;
    isolation: isolate;
    width: min(92vw, 1040px);
    margin: 0;
    padding: clamp(28px, 5vw, 68px) clamp(18px, 4vw, 54px);
    color: #fff1c7;
    text-align: center;
    text-shadow:
      0 1px 5px rgba(0, 0, 0, 0.82),
      0 0 5px rgba(255, 226, 157, 0.2),
      0 0 14px rgba(255, 204, 100, 0.13);
    transform: translate(-50%, -50%);
    animation: strata-copy-cycle 15s ease-in-out infinite;
  }

  .strata-page .strata-copy::before {
    content: "";
    position: absolute;
    inset: -18% -10%;
    z-index: -1;
    border-radius: 50%;
    background:
      radial-gradient(
        ellipse at center,
        rgba(0, 0, 0, 0.64) 0%,
        rgba(0, 0, 0, 0.5) 38%,
        rgba(0, 0, 0, 0.22) 67%,
        transparent 84%
      );
    filter: blur(10px);
    pointer-events: none;
  }

  .strata-page .strata-title,
  .strata-page .strata-poem,
  .strata-page .strata-poem-line,
  .strata-page .strata-coming-soon {
    font-family: "Glacial Indifference", Arial, Helvetica, sans-serif !important;
    font-style: normal;
    text-transform: uppercase;
  }

  .strata-page .strata-title {
    margin: 0 0 clamp(18px, 2.4vw, 30px);
    color: #fff4cf;
    font-size: clamp(2.3rem, 5.5vw, 5rem);
    font-weight: 400;
    line-height: 1.05;
    letter-spacing: 0.22em;
    text-align: center;
    text-shadow:
      0 1px 7px rgba(0, 0, 0, 0.88),
      0 0 5px rgba(255, 241, 201, 0.35),
      0 0 18px rgba(255, 195, 73, 0.2);
  }

  .strata-page .strata-divider {
    display: grid;
    grid-template-columns: minmax(38px, 1fr) auto minmax(38px, 1fr);
    align-items: center;
    gap: clamp(12px, 2vw, 24px);
    width: min(72%, 650px);
    margin: 0 auto clamp(20px, 2.6vw, 32px);
    color: rgba(255, 231, 169, 0.82);
  }

  .strata-page .strata-divider--lower {
    margin-top: clamp(20px, 2.6vw, 32px);
    margin-bottom: clamp(16px, 2vw, 24px);
  }

  .strata-page .strata-divider-line {
    display: block;
    height: 1px;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 222, 139, 0.74) 20%,
      rgba(255, 239, 196, 0.9)
    );
    box-shadow: 0 0 6px rgba(255, 200, 84, 0.22);
  }

  .strata-page .strata-divider-line:last-child {
    transform: scaleX(-1);
  }

  .strata-page .strata-divider-star {
    display: block;
    width: clamp(12px, 1.4vw, 18px);
    height: clamp(12px, 1.4vw, 18px);
    color: #fff0c4;
    filter: drop-shadow(0 0 5px rgba(255, 202, 91, 0.42));
  }

  .strata-page .strata-poem {
    display: grid;
    gap: clamp(12px, 1.6vw, 20px);
    width: 100%;
    margin: 0;
  }

  .strata-page .strata-poem-line {
    margin: 0;
    color: rgba(255, 240, 201, 0.94);
    font-size: clamp(0.86rem, 1.35vw, 1.2rem);
    font-weight: 400;
    line-height: 1.6;
    letter-spacing: 0.2em;
    text-align: center;
    text-shadow:
      0 1px 5px rgba(0, 0, 0, 0.9),
      0 0 8px rgba(255, 207, 108, 0.16);
  }

  .strata-page .strata-coming-soon {
    margin: 0;
    color: rgba(255, 232, 177, 0.9);
    font-size: clamp(0.68rem, 0.95vw, 0.88rem);
    font-weight: 400;
    line-height: 1.3;
    letter-spacing: 0.38em;
    text-align: center;
    text-shadow:
      0 1px 5px rgba(0, 0, 0, 0.9),
      0 0 8px rgba(255, 205, 96, 0.18);
  }

  @keyframes strata-copy-cycle {
    0%, 8% {
      opacity: 0;
      transform: translate(-50%, calc(-50% + 7px));
    }
    18%, 88% {
      opacity: 1;
      transform: translate(-50%, -50%);
    }
    98%, 100% {
      opacity: 0;
      transform: translate(-50%, calc(-50% - 4px));
    }
  }

  @media (max-width: 767px) {
    .strata-page .strata-video {
      object-position: center center;
    }

    .strata-page .strata-treatment {
      background:
        radial-gradient(ellipse at center, transparent 34%, rgba(0, 0, 0, 0.24) 76%, rgba(0, 0, 0, 0.42) 100%);
    }

    .strata-page .strata-copy {
      top: 52%;
      width: min(94vw, 560px);
      padding:
        clamp(24px, 5svh, 42px)
        max(15px, env(safe-area-inset-right))
        clamp(24px, 5svh, 42px)
        max(15px, env(safe-area-inset-left));
    }

    .strata-page .strata-copy::before {
      inset: -13% -5%;
      filter: blur(8px);
    }

    .strata-page .strata-title {
      margin-bottom: 17px;
      font-size: clamp(1.55rem, 7.8vw, 2.45rem);
      letter-spacing: 0.19em;
    }

    .strata-page .strata-divider {
      gap: 10px;
      width: min(82%, 430px);
      margin-bottom: 17px;
    }

    .strata-page .strata-divider--lower {
      margin-top: 18px;
      margin-bottom: 14px;
    }

    .strata-page .strata-poem {
      gap: 10px;
    }

    .strata-page .strata-poem-line {
      font-size: clamp(0.72rem, 3.25vw, 0.92rem);
      line-height: 1.58;
      letter-spacing: 0.16em;
    }

    .strata-page .strata-coming-soon {
      font-size: clamp(0.62rem, 2.65vw, 0.75rem);
      letter-spacing: 0.32em;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .strata-page .strata-copy {
      opacity: 1;
      animation: none;
    }
  }
</style>

<main class="strata-page" id="strata-beyond-page" aria-labelledby="strata-beyond-title">
  <div class="strata-media" aria-hidden="true">
    <video
      class="strata-video"
      src="https://ik.imagekit.io/vxel66ikf/Strata%20beyond%20slower%20mobile%20video%20loop/ik-video.mp4?updatedAt=1785742311299"
      muted
      loop
      autoplay
      playsinline
      webkit-playsinline
      preload="auto"
      tabindex="-1"
      disablepictureinpicture
      disableremoteplayback
      controlslist="nodownload noplaybackrate noremoteplayback"
    ></video>
    <div class="strata-treatment"></div>
  </div>

  <section class="strata-copy">
    <h1 class="strata-title" id="strata-beyond-title">STRATA BEYOND</h1>
    <div class="strata-divider" aria-hidden="true">
      <span class="strata-divider-line"></span>
      <svg class="strata-divider-star" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M12 0c.8 8 4 11.2 12 12-8 .8-11.2 4-12 12-.8-8-4-11.2-12-12 8-.8 11.2-4 12-12Z"/></svg>
      <span class="strata-divider-line"></span>
    </div>
    <div class="strata-poem">
      <p class="strata-poem-line">Beyond this door,<br>memory becomes landscape.</p>
      <p class="strata-poem-line">Myth becomes architecture.</p>
      <p class="strata-poem-line">History becomes somewhere you can walk.</p>
    </div>
    <div class="strata-divider strata-divider--lower" aria-hidden="true">
      <span class="strata-divider-line"></span>
      <svg class="strata-divider-star" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M12 0c.8 8 4 11.2 12 12-8 .8-11.2 4-12 12-.8-8-4-11.2-12-12 8-.8 11.2-4 12-12Z"/></svg>
      <span class="strata-divider-line"></span>
    </div>
    <p class="strata-coming-soon">COMING SOON</p>
  </section>
</main>

<script>
  (function () {
    var page = document.getElementById("strata-beyond-page");
    if (!page || page.dataset.strataReady === "true") return;
    page.dataset.strataReady = "true";

    var MOBILE_VIDEO = "https://ik.imagekit.io/vxel66ikf/Strata%20beyond%20slower%20mobile%20video%20loop/ik-video.mp4?updatedAt=1785742311299";
    var DESKTOP_VIDEO = "https://ik.imagekit.io/vxel66ikf/Strata%20beyond%20slower%20desktop%20video%20loop/ik-video.mp4?updatedAt=1785740755079";
    var phoneQuery = window.matchMedia("(max-width: 767px)");
    var video = page.querySelector(".strata-video");
    var resizeTimer = 0;
    var retryTimer = 0;

    /* Reuse the KIN embed's scoped top-bleed technique so this page alone
       reaches behind Webador's page-header space without changing the site. */
    var topGap = page.getBoundingClientRect().top;
    if (topGap > 0 && topGap <= 280) {
      page.style.setProperty("--strata-top-bleed", Math.round(topGap) + "px");
    }

    function requiredVideo() {
      return phoneQuery.matches ? MOBILE_VIDEO : DESKTOP_VIDEO;
    }

    function enforcePlaybackProperties() {
      video.muted = true;
      video.defaultMuted = true;
      video.controls = false;
      video.autoplay = true;
      video.loop = true;
      video.playsInline = true;
      video.removeAttribute("controls");
      video.setAttribute("muted", "");
      video.setAttribute("autoplay", "");
      video.setAttribute("loop", "");
      video.setAttribute("playsinline", "");
      video.setAttribute("webkit-playsinline", "");
    }

    function playNow() {
      enforcePlaybackProperties();
      if (!video.getAttribute("src") || document.hidden) return;

      var playAttempt;
      try {
        playAttempt = video.play();
      } catch (error) {
        return;
      }

      if (playAttempt && typeof playAttempt.catch === "function") {
        playAttempt.catch(function () {
          /* Muted autoplay is retried as soon as media/browser state permits. */
        });
      }
    }

    function setVideoSource() {
      var required = requiredVideo();
      enforcePlaybackProperties();

      if (video.getAttribute("src") !== required) {
        video.setAttribute("src", required);
        video.load();
      }

      playNow();
    }

    function scheduleSourceCheck() {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(setVideoSource, 120);
    }

    function resumePlayback() {
      if (!document.hidden) playNow();
    }

    video.addEventListener("loadedmetadata", playNow);
    video.addEventListener("loadeddata", playNow);
    video.addEventListener("canplay", playNow);
    video.addEventListener("pause", function () {
      if (document.hidden || !video.getAttribute("src")) return;
      window.clearTimeout(retryTimer);
      retryTimer = window.setTimeout(playNow, 80);
    });
    video.addEventListener("ended", function () {
      video.currentTime = 0;
      playNow();
    });

    setVideoSource();

    if (typeof phoneQuery.addEventListener === "function") {
      phoneQuery.addEventListener("change", setVideoSource);
    } else {
      phoneQuery.addListener(setVideoSource);
    }

    document.addEventListener("visibilitychange", resumePlayback);
    window.addEventListener("pageshow", resumePlayback);
    window.addEventListener("orientationchange", setVideoSource, { passive: true });
    window.addEventListener("resize", scheduleSourceCheck, { passive: true });

    /* Fallback for browsers that defer autoplay until the first user gesture. */
    ["pointerdown", "touchstart", "keydown"].forEach(function (eventName) {
      document.addEventListener(eventName, playNow, { passive: true, once: true });
    });

    window.setInterval(function () {
      if (!document.hidden && video.paused) playNow();
    }, 1500);
  })();
</script>
